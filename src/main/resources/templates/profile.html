<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/profile.css">
    <link rel="stylesheet" href="/css/options-menu.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="/js/security.js"></script>
    <script src="/js/options-menu.js" defer></script>
    <script src="/js/profile.js" defer></script>
</head>
<body>
  <div class="profile-container">
    <h1>Perfil</h1>
    <form id="profileForm" onsubmit="return false;">
      <div class="field">
        <label for="name">Nome</label>
        <input type="text" id="name" placeholder="Nome completo" />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required />
      </div>
      <div class="field">
        <label for="bio">Bio (opcional)</label>
        <textarea id="bio" rows="4" placeholder="Uma breve biografia"></textarea>
      </div>

      <div class="photos-section">
        <h3>Fotos</h3>
        <div id="photoList" class="photo-list" aria-live="polite"></div>
        <div class="photo-controls">
          <input type="file" id="photoInput" accept="image/*" multiple />
        </div>
      </div>

      <div class="actions">
        <button id="saveBtn" type="button">Salvar</button>
        <button id="clearBtn" type="button">Remover todas</button>
      </div>
    </form>

    <div id="result" class="result"></div>
  </div>
  <script src="/META-INF/resources/js/profile.js"></script>
</body>
</html>
