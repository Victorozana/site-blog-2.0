<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meu Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/profile.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="/js/security.js"></script>
    <script src="/js/profile.js" defer></script>
</head>
<body>
<header class="site-header">
    <div class="container py-3">
        <div class="site-nav">
            <a href="/" class="brand-link">Blog do Victor</a>
            <a href="/" class="btn btn-outline-dark">Voltar</a>
        </div>
    </div>
</header>

<main class="container my-5">
    <section class="profile-layout" aria-label="Configurações de perfil">
        <article class="profile-card" aria-label="Prévia pública do perfil">
            <div class="profile-cover"></div>
            <div class="profile-summary">
                <img id="profilePreviewImage" class="profile-avatar" src="/img/avatar-placeholder.svg" alt="Foto do perfil">
                <div>
                    <p class="section-kicker">Prévia pública</p>
                    <h1 id="profilePreviewName">Seu nome</h1>
                    <p id="profilePreviewBio" class="profile-bio">Sua bio aparecerá aqui.</p>
                </div>
            </div>
        </article>

        <aside class="edit-panel" aria-label="Editar perfil">
            <h2>Editar Perfil</h2>
            <p class="panel-subtitle">Altere somente como as outras pessoas veem seu perfil.</p>

            <form id="profileForm">
                <div class="mb-4">
                    <label for="photoInput" class="form-label">Foto de perfil</label>
                    <input class="form-control" type="file" id="photoInput" accept="image/*">
                </div>

                <div class="mb-4">
                    <label for="bio" class="form-label">Bio</label>
                    <textarea class="form-control" id="bio" rows="5" maxlength="280" placeholder="Conte um pouco sobre você"></textarea>
                    <div class="field-hint"><span id="bioCount">0</span>/280 caracteres</div>
                </div>

                <button id="saveBtn" type="submit" class="btn btn-primary w-100">Salvar perfil</button>
            </form>

            <div id="profileMessage" class="profile-message" role="status" aria-live="polite"></div>
        </aside>
    </section>
</main>
</body>
</html>
