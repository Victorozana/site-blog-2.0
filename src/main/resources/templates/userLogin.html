<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/global.css">
    <script src="/js/userLogin.js" defer></script>
</head>
<body class="page-center">
<div class="glass-card">
    <h2 class="text-center mb-4">Login</h2>
    <form id="formLogin">
        <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input type="email" class="form-control" id="email" aria-describedby="emailHelp" autocomplete="email" required>
        </div>
        <div class="mb-3">
            <label class="form-label" for="password">Senha</label>
            <input type="password" class="form-control" id="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-main" id="btnEntrar">Entrar</button>
        <div class="auth-link">
            <a href="/register/user">Criar conta</a>
        </div>
    </form>
</div>
</body>
</html>
