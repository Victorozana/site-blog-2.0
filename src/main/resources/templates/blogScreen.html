<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Leitura - Meu Blog | IFG</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/blogScreen.css">
    <script src="/js/permissionGuard.js"></script>
    <script src="/js/blogScreen.js"></script>
</head>
<body>

<header class="container py-4">
    <div class="d-flex justify-content-between align-items-center border-bottom pb-3">
        <a href="/" class="text-decoration-none fs-4 fw-bold text-dark">BLOG DO VICTOR</a>
        <a href="/register/user" class="btn btn-outline-dark">Sign up</a>
    </div>
</header>

<main class="container my-5">
    <article class="glass-card post-article">
        <header class="mb-3">
            <h1 id="post-title" class="post-title">Título do Post</h1>
            <h2 id="post-subtitle" class="post-subtitle">Subtítulo ou resumo curto do post</h2>
            <div class="post-meta mt-3">
                <small id="post-data" class="post-data">01/01/2026</small>
                <small id="post-author" class="post-author"> — Autor: Victor Oliveira</small>
            </div>
        </header>

        <section id="post-description" class="post-description mt-4">
        </section>

        <footer class="mt-4">
            <a href="/" class="btn btn-sm btn-primary post-link">Voltar aos posts</a>
        </footer>
    </article>
</main>

<footer class="container py-5 text-center text-muted">
    <p>&copy; 2026 Victor Oliveira - Projeto IFG.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
