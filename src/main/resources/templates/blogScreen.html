<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Leitura - Meu Blog | IFG</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/blogScreen.css">
    <link rel="stylesheet" href="/css/options-menu.css">
    <link rel="stylesheet" href="/css/blog-interactions.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/security.js"></script>
    <script src="/js/options-menu.js" defer></script>
    <script src="/js/blogScreen.js" defer></script>
</head>
<body>
<header class="site-header">
    <div class="container py-3">
    <div class="site-nav">
        <a href="/" class="brand-link">Blog do Victor</a>
        <div class="options-menu">
          <button class="options-toggle" aria-expanded="false" aria-haspopup="true" aria-label="Mais opções">
            <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor" focusable="false">
              <circle cx="5" cy="12" r="2"></circle>
              <circle cx="12" cy="12" r="2"></circle>
              <circle cx="19" cy="12" r="2"></circle>
            </svg>
          </button>
          <div class="options-dropdown" role="menu" hidden>
            <a href="/register/blog" role="menuitem" id="menuCreatePost" class="menu-create-post">Criar Post</a>
            <a href="/blog/manage" role="menuitem" id="menuManagePosts">Gerenciar Posts</a>
            <a href="/user" role="menuitem">Perfil</a>
            <a href="/admin" role="menuitem" id="menuAdmin">Configurações</a>
            <button type="button" role="menuitem" id="logout-btn">Sair</button>
          </div>
        </div>
    </div>
    </div>
</header>
<main class="container my-5">
    <article class="glass-card post-article">
        <header class="mb-3">
            <h1 id="post-title" class="post-title">Título do Post</h1>
            <h2 id="post-subtitle" class="post-subtitle">Subtítulo ou resumo curto do post</h2>
            <div class="post-meta mt-3">
                <small id="post-data" class="post-data">01/01/2026</small>
                <a class="post-author" id="post-author-link" href="#">
                    <img id="post-author-avatar" class="post-author-avatar" src="/img/avatar-placeholder.svg" alt="">
                    <span id="post-author-name">Victor Oliveira</span>
                </a>
            </div>
        </header>

        <section id="post-description" class="post-description mt-4" aria-live="polite">
        </section>

        <section id="post-management" class="post-management d-none" aria-label="Gerenciar post">
            <div class="management-header">
                <div>
                    <p class="section-kicker">Gerenciar</p>
                    <h3>Editar publicação</h3>
                </div>
                <button id="btnDeletePost" type="button" class="btn btn-outline-danger">Excluir post</button>
            </div>

            <form id="editPostForm" class="edit-post-form">
                <div class="mb-3">
                    <label for="editTitle" class="form-label">Título</label>
                    <input id="editTitle" class="form-control" type="text" required>
                </div>

                <div class="mb-3">
                    <label for="editSubtitle" class="form-label">Subtítulo</label>
                    <input id="editSubtitle" class="form-control" type="text">
                </div>

                <div class="mb-3">
                    <label for="editCategory" class="form-label">Categoria</label>
                    <select id="editCategory" class="form-select" required>
                        <option value="mistery">Mistério</option>
                        <option value="selfhelp">Autoajuda</option>
                        <option value="advices">Dicas</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="editDescription" class="form-label">Conteúdo</label>
                    <textarea id="editDescription" class="form-control" rows="8" required></textarea>
                </div>

                <div class="management-actions">
                    <button id="btnSavePost" type="submit" class="btn btn-primary">Salvar alterações</button>
                    <span id="postManagementMessage" class="management-message" role="status" aria-live="polite"></span>
                </div>
            </form>
        </section>

        <div class="post-actions d-flex gap-3 mt-4 align-items-center">
            <button id="btnLike" class="btn btn-outline-danger btn-like" aria-pressed="false">
                <span class="like-icon">❤</span>
                <span id="likeCount">0</span>
            </button>
            <button id="btnToggleComments" class="btn btn-outline-secondary" aria-expanded="false" aria-controls="comments">Comentários</button>
        </div>

        <section id="comments" class="mt-4 d-none">
            <div id="comments-list" class="mb-3">
                <!-- comentários serão renderizados aqui -->
            </div>
            <form id="comment-form" class="comment-form" onsubmit="return false;">
                <label for="commentText" class="visually-hidden">Comentário</label>
                <textarea id="commentText" class="form-control" rows="2" placeholder="Escreva um comentário..." required></textarea>
                <button id="btnSendComment" class="btn btn-primary">Enviar</button>
            </form>
        </section>

        <footer class="mt-4">
            <a href="/" class="btn btn-sm btn-primary post-link">Voltar aos posts</a>
        </footer>
    </article>
</main>
<footer class="container py-5 text-center text-muted">
    <p>&copy; 2026 Victor Oliveira - Projeto IFG.</p>
</footer>
</body>
</html>
