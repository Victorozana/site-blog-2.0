<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Usuário</title>
    <link rel="stylesheet" href="site-blog-cadastro.css">
</head>
<body class="table-header">

<form id="formCadastro">
    <div class="mb-3">
        <label class="form-label">Nome</label>
        <label for="name"></label><input type="text" class="form-control" id="name">
    </div>
    <div class="mb-3">
        <label class="form-label">Sobrenome</label>
        <label for="lastname"></label><input type="text" class="form-control" id="lastname">
    </div>
    <div class="mb-3">
        <label class="form-label">Data Nascimento</label>
        <input type="date" class="form-control" id="dt_nasc">
    </div>
    <div class="mb-3">
        <label class="form-label">Telefone</label>
        <input type="tel" class="form-control" id="fone">
    </div>
    <div class="mb-3">
        <label class="form-label">Tipo de usuário:</label><label for="user_type"></label><select id="user_type" name="userType">
            <option value="writer">Escritor</option>
            <option value="reader">Leitor</option>
        </select>
    </div>
    <div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <label for="email"></label><input type="email" class="form-control" id="email" aria-describedby="emailHelp">
        </div>
    </div>
    <div class="mb-3">
        <label class="form-label">Senha</label>
        <label for="password"></label><label for="cryptography_password"></label><input type="password" class="form-control" id="cryptography_password">
    </div>
<!--    <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="exampleCheck1">
        <label class="form-check-label" for="exampleCheck1">Salvar dados</label>
    </div> -->
    <button type="submit" class="btn btn-primary" id="btnSalvar">Cadastrar</button>
</form>

<script src="cadastroUsuario.js"></script>
</body>
</html>
