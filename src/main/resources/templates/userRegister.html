<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastrar Usuário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/global.css">
    <script src="/js/userRegister.js" defer></script>
</head>
<body class="page-center">
    <div class="glass-card">
        <h2 class="text-center mb-4">Cadastro</h2>

        <form id="formCadastro">
            <div class="mb-3">
                <label class="form-label" for="name">Nome</label>
                <input type="text" class="form-control" id="name" autocomplete="given-name" required>
            </div>

            <div class="mb-3">
                <label class="form-label" for="lastname">Sobrenome</label>
                <input type="text" class="form-control" id="lastname" autocomplete="family-name" required>
            </div>
    <div class="mb-3">
        <label class="form-label" for="dt_nasc">Data Nascimento</label>
        <input type="text" class="form-control" id="dt_nasc" placeholder="DD/MM/YYYY" autocomplete="bday" required>
    </div>
    <div class="mb-3">
        <label class="form-label" for="fone">Telefone</label>
        <input type="tel" class="form-control" id="fone" placeholder="(99)99999-2222" autocomplete="tel" required>
    </div>
    <div class="mb-3">
        <label class="form-label" for="user_type">Tipo de usuário:</label>
        <select class="form-select" id="user_type" name="userType" required>
            <option value="WRITER">Escritor</option>
            <option value="READER">Leitor</option>
        </select>
    </div>
    <div>
        <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input type="email" class="form-control" id="email" aria-describedby="emailHelp" autocomplete="email" required>
        </div>
    </div>
    <div class="mb-3">
        <label class="form-label" for="password">Senha</label>
        <input type="password" class="form-control" id="password" autocomplete="new-password" required>
    </div>
    <div class="auth-actions">
        <button type="submit" class="btn-main" id="btnSalvar">Cadastrar</button>
        <a href="/login" class="btn btn-outline-secondary w-100">Voltar para login</a>
    </div>
</form>
    </div>
</body>
</html>
