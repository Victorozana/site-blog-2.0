<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meu Blog Cético | IFG</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="/css/global.css">
</head>
<body>

<header class="container py-4">
    <div class="d-flex justify-content-between align-items-center border-bottom pb-3">
        <a href="/" class="text-decoration-none fs-4 fw-bold text-dark">BLOG DO VICTOR</a>
        <a href="/register/user" class="btn btn-outline-dark">Sign up</a>
    </div>
</header>

<main class="container my-5">
    <div id="listaBlogs" class="row g-4">
    </div>

    <nav class="d-flex justify-content-center mt-5 gap-3">
        <button id="btnAnterior" class="btn btn-secondary px-4" disabled>Anterior</button>
        <span id="infoPagina" class="align-self-center fw-bold">Página 1</span>
        <button id="btnProximo" class="btn btn-secondary px-4">Próximo</button>
    </nav>
</main>

<footer class="container py-5 text-center text-muted">
    <p>&copy; 2026 Victor Oliveira - Projeto IFG.</p>
</footer>

<template id="blog-card-template">
    <div class="col-12">
        <div class="glass-card h-100">
            <h3 class="post-titulo fw-bold post-title">Título do Post</h3>
            <small class="text-muted post-data post-date">01/01/2026</small>
            <p class="post-resumo mt-2 post-subtitle">Breve descrição do que o usuário vai ler...</p>
            <a href="#" class="btn btn-sm btn-primary post-link">Ler mais</a>
        </div>
    </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/mainScreen.js"></script>
</body>
</html>
