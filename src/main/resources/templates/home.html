<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meu Blog | IFG</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/home.css">
    <link rel="stylesheet" href="/css/options-menu.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="/js/security.js"></script>
    <script src="/js/options-menu.js" defer></script>
    <script src="/js/home.js" defer></script>
</head>
<body>
<header class="site-header">
    <div class="container py-3">
        <div class="site-nav">
            <a href="/" class="brand-link">Blog do Victor</a>
            <div class="d-flex gap-2 align-items-center">
            <span class="fw-semibold text-dark" id="userName"></span>
            </div>
            <div class="options-menu">
                <button class="options-toggle" aria-expanded="false" aria-haspopup="true" aria-label="Mais opções">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" focusable="false" aria-hidden="true">
                        <circle cx="5" cy="12" r="2"></circle>
                        <circle cx="12" cy="12" r="2"></circle>
                        <circle cx="19" cy="12" r="2"></circle>
                    </svg>
                </button>
                <div class="options-dropdown" role="menu" hidden>
                    <a href="/register/blog" role="menuitem" id="menuCreatePost" class="menu-create-post">Criar Post</a>
                    <a href="/blog/manage" role="menuitem" id="menuManagePosts">Gerenciar Posts</a>
                    <a href="/user" role="menuitem">Perfil</a>
                    <a href="/admin" role="menuitem" id="menuAdmin">Configurações</a>
                    <button type="button" role="menuitem" id="logout-btn">Sair</button>
                </div>
            </div>
        </div>
    </div>
</header>
<main class="container my-5">
    <section class="page-intro">
        <div>
            <p class="section-kicker">Publicações</p>
            <h1>Artigos Recentes</h1>
            <p>Explore os últimos posts e reflexões.</p>
        </div>
        <div class="home-actions">
            <a href="/register/blog" id="homeCreatePost" class="btn btn-primary create-post-cta">Criar post</a>
            <a href="/blog/manage" id="homeManagePosts" class="btn btn-outline-secondary create-post-cta">Gerenciar posts</a>
        </div>
    </section>

    <div id="listaBlogs" class="post-list" aria-live="polite">
    </div>
    <nav class="pagination-bar" aria-label="Paginação de posts">
        <button id="btnAnterior" class="btn btn-secondary px-4" disabled>Anterior</button>
        <span id="infoPagina" class="page-indicator">Página 1</span>
        <button id="btnProximo" class="btn btn-secondary px-4">Próximo</button>
    </nav>
</main>
<footer class="container py-5 text-center text-muted">
    <p>&copy; 2026 Victor Oliveira - Projeto IFG.</p>
</footer>
<template id="blog-card-template">
    <article class="post-card">
        <div>
            <a class="post-author-row" href="#">
                <img class="post-author-avatar" src="/img/avatar-placeholder.svg" alt="">
                <span class="post-author-name">Autor</span>
            </a>
            <h3 class="post-titulo fw-bold post-title">Título do Post</h3>
            <small class="text-muted post-data post-date">01/01/2026</small>
            <p class="post-resumo mt-2 post-subtitle">Breve descrição do que o usuário vai ler...</p>
        </div>
        <a href="/blog" class="btn btn-sm btn-primary post-link">Ler mais</a>
    </article>
</template>
</body>
</html>
