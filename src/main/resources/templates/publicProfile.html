<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Perfil do Autor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/profile.css">
    <script src="/js/security.js"></script>
    <script src="/js/publicProfile.js" defer></script>
</head>
<body>
<header class="site-header">
    <div class="container py-3">
        <div class="site-nav">
            <a href="/" class="brand-link">Blog do Victor</a>
            <a href="/" class="btn btn-outline-dark">Voltar</a>
        </div>
    </div>
</header>

<main class="container my-5">
    <article class="profile-card public-profile-card" aria-label="Perfil público">
        <div class="profile-cover"></div>
        <div class="profile-summary">
            <img id="publicProfileImage" class="profile-avatar" src="/img/avatar-placeholder.svg" alt="Foto do perfil">
            <div>
                <p class="section-kicker">Perfil público</p>
                <h1 id="publicProfileName">Carregando...</h1>
                <p id="publicProfileBio" class="profile-bio">Buscando informações do autor.</p>
            </div>
        </div>
    </article>
</main>
</body>
</html>
