<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gerenciar Posts - Meu Blog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/options-menu.css">
    <link rel="stylesheet" href="/css/managePosts.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="/js/security.js"></script>
    <script src="/js/options-menu.js" defer></script>
    <script src="/js/managePosts.js" defer></script>
</head>
<body>
<header class="site-header">
    <div class="container py-3">
        <div class="site-nav">
            <a href="/" class="brand-link">Blog do Victor</a>
            <div class="header-actions">
                <a href="/register/blog" id="headerCreatePost" class="btn btn-primary">Criar post</a>
                <a href="/" class="btn btn-outline-dark">Voltar</a>
                <div class="options-menu">
                    <button class="options-toggle" aria-expanded="false" aria-haspopup="true" aria-label="Mais opções">
                        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor" focusable="false">
                            <circle cx="5" cy="12" r="2"></circle>
                            <circle cx="12" cy="12" r="2"></circle>
                            <circle cx="19" cy="12" r="2"></circle>
                        </svg>
                    </button>
                    <div class="options-dropdown" role="menu" hidden>
                        <a href="/register/blog" role="menuitem" id="menuCreatePost" class="menu-create-post">Criar Post</a>
                        <a href="/blog/manage" role="menuitem" id="menuManagePosts">Gerenciar Posts</a>
                        <a href="/user" role="menuitem">Perfil</a>
                        <a href="/admin" role="menuitem" id="menuAdmin">Configurações</a>
                        <button type="button" role="menuitem" id="logout-btn">Sair</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>
<main class="container my-5">
    <section class="manage-intro">
        <div>
            <p class="section-kicker">Publicações</p>
            <h1>Gerenciar Posts</h1>
            <p>Revise, edite ou exclua posts publicados.</p>
        </div>
    </section>
    <div id="manageMessage" class="manage-message" role="status" aria-live="polite"></div>
    <section id="managedPostsList" class="managed-post-list" aria-live="polite"></section>
</main>
<template id="managedPostTemplate">
    <article class="managed-post">
        <div class="managed-post-content">
            <small class="managed-post-date"></small>
            <h2 class="managed-post-title"></h2>
            <p class="managed-post-subtitle"></p>
            <p class="managed-post-author"></p>
        </div>
        <div class="managed-post-actions">
            <a class="btn btn-primary managed-post-edit" href="#">Editar</a>
            <button type="button" class="btn btn-outline-danger managed-post-delete">Excluir</button>
        </div>
    </article>
</template>
</body>
</html>
