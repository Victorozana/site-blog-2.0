<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Administração</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/options-menu.css">
    <link rel="stylesheet" href="/css/admin.css">
    <script src="/js/security.js"></script>
    <script src="/js/options-menu.js" defer></script>
    <script src="/js/admin.js" defer></script>
</head>
<body>
<header class="site-header">
    <div class="container py-3">
        <div class="site-nav">
            <a href="/" class="brand-link">Blog do Victor</a>
            <div class="admin-actions header-actions">
                <a href="/" class="btn btn-outline-dark">Voltar</a>
                <button type="button" class="btn btn-outline-danger" id="logoutAdmin">Sair</button>
                <div class="options-menu">
                    <button class="options-toggle" aria-expanded="false" aria-haspopup="true" aria-label="Mais opções">
                        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor" focusable="false">
                            <circle cx="5" cy="12" r="2"></circle>
                            <circle cx="12" cy="12" r="2"></circle>
                            <circle cx="19" cy="12" r="2"></circle>
                        </svg>
                    </button>
                    <div class="options-dropdown" role="menu" hidden>
                        <a href="/register/blog" role="menuitem" id="menuCreatePost" class="menu-create-post">Criar Post</a>
                        <a href="/blog/manage" role="menuitem" id="menuManagePosts">Gerenciar Posts</a>
                        <a href="/user" role="menuitem">Perfil</a>
                        <a href="/admin" role="menuitem" id="menuAdmin">Configurações</a>
                        <button type="button" role="menuitem" id="logout-btn">Sair</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>
<main class="container my-5">
    <section class="admin-intro">
        <p class="section-kicker">Área administrativa</p>
        <h1>Configurações do sistema</h1>
        <p>Controle perfis cadastrados e acompanhe as ações auditadas no sistema.</p>
    </section>
    <section class="admin-grid">
        <article class="admin-panel">
            <div class="panel-heading">
                <h2>Perfis Criados</h2>
                <span id="usersCount" class="admin-counter">0</span>
            </div>
            <div class="table-responsive">
                <table class="table align-middle">
                    <thead>
                    <tr>
                        <th>Usuário</th>
                        <th>Email</th>
                        <th>Papel</th>
                        <th>Criado em</th>
                    </tr>
                    </thead>
                    <tbody id="usersTable"></tbody>
                </table>
            </div>
        </article>
        <article class="admin-panel">
            <div class="panel-heading">
                <h2>Auditoria Recente</h2>
                <button type="button" id="refreshAudit" class="btn btn-sm btn-outline-secondary">Atualizar</button>
            </div>
            <div id="auditList" class="audit-list" aria-live="polite"></div>
        </article>
    </section>
</main>
</body>
</html>
