<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Criar Post - Meu Blog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/blogRegister.css">
    <link rel="stylesheet" href="/css/options-menu.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="/js/security.js"></script>
    <script src="/js/options-menu.js" defer></script>
    <script src="/js/blogRegister.js" defer></script>
</head>
<body>
<header class="site-header">
    <div class="container py-3">
    <div class="site-nav">
        <a href="/" class="brand-link">Blog do Victor</a>
        <div class="d-flex gap-2 align-items-center">
            <a href="/" class="btn btn-outline-dark">Voltar</a>
        </div>
        <div class="options-menu">
          <button class="options-toggle" aria-expanded="false" aria-haspopup="true" aria-label="Mais opções">
            <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor" focusable="false">
              <circle cx="5" cy="12" r="2"></circle>
              <circle cx="12" cy="12" r="2"></circle>
              <circle cx="19" cy="12" r="2"></circle>
            </svg>
          </button>
          <div class="options-dropdown" role="menu" hidden>
            <a href="/register/blog" role="menuitem" id="menuCreatePost" class="menu-create-post">Criar Post</a>
            <a href="/blog/manage" role="menuitem" id="menuManagePosts">Gerenciar Posts</a>
            <a href="/user" role="menuitem">Perfil</a>
            <a href="/admin" role="menuitem" id="menuAdmin">Configurações</a>
            <button type="button" role="menuitem" id="logout-btn">Sair</button>
          </div>
        </div>
    </div>
    </div>
</header>
<main class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="glass-card glass-card--wide form-panel">
                <h2 class="text-center mb-4 fw-bold">Criar Novo Post</h2>
                <form id="formBlogRegister">
                    <!-- Título do Post -->
                    <div class="mb-4">
                        <label class="form-label" for="title">Título</label>
                        <input 
                            type="text" 
                            class="form-control" 
                            id="title" 
                            placeholder="Digite o título do seu post"
                            required
                        >
                    </div>
                    <!-- Subtítulo do Post -->
                    <div class="mb-4">
                        <label class="form-label" for="subtitle">Subtítulo</label>
                        <input 
                            type="text" 
                            class="form-control" 
                            id="subtitle" 
                            placeholder="Um breve resumo do post"
                        >
                    </div>
                    <!-- Categoria -->
                    <div class="mb-4">
                        <label class="form-label" for="category">Categoria</label>
                        <select class="form-select" id="category" required>
                            <option value="">Selecione uma categoria</option>
                            <option value="mistery">Mistério</option>
                            <option value="selfhelp">Autoajuda</option>
                            <option value="advices">Dicas</option>
                        </select>
                    </div>
                    <!-- Descrição/Conteúdo do Post -->
                    <div class="mb-4">
                        <label class="form-label" for="description">Conteúdo</label>
                        <textarea 
                            class="form-control form-textarea" 
                            id="description" 
                            rows="10"
                            maxlength="1000"
                            placeholder="Escreva o conteúdo completo do seu post aqui..."
                            required
                        ></textarea>
                        <div class="character-counter" aria-live="polite">
                            <span id="descriptionCount">0</span>/1000 caracteres
                        </div>
                    </div>
                    <!-- Botões de Ação -->
                    <div class="form-actions">
                        <button type="submit" class="btn-main flex-grow-1" id="btnPublicar">Publicar Post</button>
                        <button type="reset" class="btn btn-outline-secondary flex-grow-1">Limpar</button>
                    </div>
                </form>
                <!-- Mensagem de Feedback -->
                <div id="mensagem" class="mt-3 alert d-none" role="alert"></div>
            </div>
        </div>
    </div>
</main>
<footer class="container py-5 text-center text-muted">
    <p>&copy; 2026 Victor Oliveira - Projeto IFG.</p>
</footer>
</body>
</html>
