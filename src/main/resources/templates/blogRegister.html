<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Criar Post - Meu Blog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/blogRegister.css">
</head>
<body>

<header class="container py-4">
    <div class="d-flex justify-content-between align-items-center border-bottom pb-3">
        <a href="/" class="text-decoration-none fs-4 fw-bold text-dark">BLOG DO VICTOR</a>
        <a href="/" class="btn btn-outline-dark">Voltar</a>
    </div>
</header>

<main class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="glass-card glass-card--wide">
                <h2 class="text-center mb-4 fw-bold">Criar Novo Post</h2>
                
                <form id="formBlogRegister">
                    <!-- Título do Post -->
                    <div class="mb-4">
                        <label class="form-label" for="title">Título</label>
                        <input 
                            type="text" 
                            class="form-control" 
                            id="title" 
                            placeholder="Digite o título do seu post"
                            required
                        >
                    </div>

                    <!-- Subtítulo do Post -->
                    <div class="mb-4">
                        <label class="form-label" for="subtitle">Subtítulo</label>
                        <input 
                            type="text" 
                            class="form-control" 
                            id="subtitle" 
                            placeholder="Um breve resumo do post"
                            required
                        >
                    </div>

                    <!-- Categoria -->
                    <div class="mb-4">
                        <label class="form-label" for="category">Categoria</label>
                        <select class="form-select" id="category" required>
                            <option value="">Selecione uma categoria</option>
                            <option value="mistery">Mistério</option>
                            <option value="selfhelp">Autoajuda</option>
                            <option value="advices">Dicas</option>
                        </select>
                    </div>

                    <!-- Descrição/Conteúdo do Post -->
                    <div class="mb-4">
                        <label class="form-label" for="description">Conteúdo</label>
                        <textarea 
                            class="form-control form-textarea" 
                            id="description" 
                            rows="10"
                            placeholder="Escreva o conteúdo completo do seu post aqui..."
                            required
                        ></textarea>
                    </div>

                    <!-- Botões de Ação -->
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn-main flex-grow-1" id="btnPublicar">Publicar Post</button>
                        <button type="reset" class="btn btn-outline-secondary flex-grow-1">Limpar</button>
                    </div>
                </form>

                <!-- Mensagem de Feedback -->
                <div id="mensagem" class="mt-3 alert d-none" role="alert"></div>
            </div>
        </div>
    </div>
</main>

<footer class="container py-5 text-center text-muted">
    <p>&copy; 2026 Victor Oliveira - Projeto IFG.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/jwtUtils.js"></script>
<script src="/js/permissionGuard.js"></script>
<script src="/js/blogRegister.js"></script>
</body>
</html>
