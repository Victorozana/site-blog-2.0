<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastrar Usuário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/global.css">
</head>
<body class="page-center"> <!-- A classe page-center centraliza TUDO no meio -->


    <div class="glass-card"> <!-- ESSA DIV É O QUE LIMITA O TAMANHO E DÁ O EFEITO DE VIDRO -->
        <h2 class="text-center mb-4">Cadastro</h2>

        <form id="formCadastro">
            <div class="mb-3">
                <label class="form-label">Nome</label>
                <input type="text" class="form-control" id="name" autocomplete="given-name" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Sobrenome</label>
                <input type="text" class="form-control" id="lastname" autocomplete="family-name" required>
            </div>
    <div class="mb-3">
        <label class="form-label">Data Nascimento</label>
        <input type="date" class="form-control" id="dt_nasc" autocomplete="bday" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Telefone</label>
        <input type="tel" class="form-control" id="fone" autocomplete="tel" required>
    </div>
    <div class="mb-3">
        <label class="form-label" for="user_type">Tipo de usuário:</label>
        <select class="form-select" id="user_type" name="userType" required>
            <option value="writer">Escritor</option>
            <option value="reader">Leitor</option>
        </select>
    </div>
    <div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <label for="email"></label><input type="email" class="form-control" id="email" aria-describedby="emailHelp" autocomplete="email" required>
        </div>
    </div>
    <div class="mb-3">
        <label class="form-label">Senha</label>
        <label for="password"></label><label for="cryptography_password"></label><input type="password" class="form-control" id="cryptography_password" autocomplete="new-password" required>
    </div>
<!--    <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="exampleCheck1">
        <label class="form-check-label" for="exampleCheck1">Salvar dados</label>
    </div> -->
    <button type="submit" class="btn-main" id="btnSalvar">Cadastrar</button>
</form>
    </div>
<script src="/cadastroUsuario.js"></script>
</body>
</html>
