# 1. Tipo do banco de dados (Ex: postgresql, mysql, h2)
quarkus.datasource.db-kind=postgresql

# 2. Credenciais de acesso
quarkus.datasource.username=postgres
quarkus.datasource.password=1234

# 3. URL de conexão JDBC
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/site-blog

# 4. Estratégia de geração das tabelas (Hibernate ORM)
# 'update' cria as tabelas automaticamente com base nas suas classes @Entity
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.format-sql=true

# IMPORTANTE: Desativa o banco automático do Quarkus (Dev Services)
# para ele focar no seu banco local
quarkus.datasource.devservices.enabled=false

# 1. Para VALIDAR o token (Lê a chave pública padrão)
# O nome do cookie DEVE ser idêntico ao que você gerou no NewCookie.Builder("meu_token_jwt") do seu Login
smallrye.jwt.token.cookie=meu_token_jwt
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=http://localhost:8080
mp.jwt.token.header=Cookie

# 2. Para CRIAR o token (Lê a chave privada convertida para o Java)
smallrye.jwt.sign.key.location=privateKey-pkcs8.pem