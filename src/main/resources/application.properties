# 1. Tipo do banco de dados
quarkus.datasource.db-kind=postgresql
# 2. Credenciais de acesso
quarkus.datasource.username=postgres
quarkus.datasource.password=1234
# 3. URL de conexão JDBC
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/site-blog

# 4. Estratégia de geração das tabelas (Hibernate ORM)
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.format-sql=true
quarkus.datasource.devservices.enabled=false
# 5. Para VALIDAR o token (Lê a chave pública padrão)
smallrye.jwt.token.cookie=meu_token_jwt
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=http://localhost:8080
mp.jwt.token.header=Cookie
# 6. Para CRIAR o token (Lê a chave privada convertida para o Java)
smallrye.jwt.sign.key.location=privateKey-pkcs8.pem